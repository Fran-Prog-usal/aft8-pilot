[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aft8-pilot"
version = "0.1.0"
description = "Instrumentación y análisis del piloto AFT8 sobre modelos de lenguaje"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4,<3",
]

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4"]
analysis = ["pandas>=2.2,<4", "pyarrow>=18,<26", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4"]
extraction = ["transformers>=5.16,<5.18", "tokenizers>=0.22,<1", "safetensors>=0.6,<1", "sentencepiece>=0.2,<1", "pandas>=2.2,<4", "pyarrow>=18,<26"]

[project.scripts]
aft8-import-corpus = "aft8.corpus:main"
aft8-validate-results = "aft8.validation:main"
aft8-build-controls = "aft8.controls:main"
aft8-analyze = "aft8.analysis:main"
aft8-diagnostics = "aft8.diagnostics:main"
aft8-prepare-input = "aft8.corpus:prepare_input"
aft8-extract = "aft8.extraction:main"
aft8-compare-runs = "aft8.compare_runs:main"

[tool.setuptools.packages.find]
where = ["src"]
